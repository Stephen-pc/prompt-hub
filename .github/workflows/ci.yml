name: CI

# 浏览器扩展没有传统单元测试，但有两类错误可以机器拦：
#   1. 站点列表在 manifest / content / background 三处各写一份，漏一处就会
#      「某个站点点填入没反应」——不报错、控制台干净。
#   2. 平台改版导致输入框选择器失配，症状同上。
# 前者查静态一致性，后者用 Playwright 在伪造页面上真的填一次。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 清单与站点一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 一致性检查
        run: node tools/check-consistency.js

      - name: 所有脚本语法可解析
        run: |
          set -e
          for f in $(find . -name "*.js" -not -path "./node_modules/*"); do
            node --check "$f"
            echo "  ok   $f"
          done

      - name: 图标尺寸与实际文件一致
        run: |
          node - <<'JS'
          const { readFileSync } = require('node:fs')
          const manifest = JSON.parse(readFileSync('manifest.json', 'utf8'))
          const sizeOf = (p) => {
            const b = readFileSync(p)
            // PNG: 宽高在 IHDR，偏移 16/20，大端
            return { w: b.readUInt32BE(16), h: b.readUInt32BE(20) }
          }
          let bad = 0
          for (const [declared, path] of Object.entries(manifest.icons)) {
            const { w, h } = sizeOf(path)
            if (w !== Number(declared) || h !== Number(declared)) {
              console.error(`  FAIL ${path} 实际 ${w}×${h}，声明 ${declared}`)
              bad++
            } else {
              console.log(`  ok   ${declared}px -> ${path}`)
            }
          }
          process.exit(bad ? 1 : 0)
          JS

  fill:
    name: 填入逻辑端到端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖与浏览器
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # 用路由拦截把 chatgpt.com / claude.ai 的响应换成本地 fixture，
      # hostname 仍是原站点，所以平台识别和选择器匹配走的是真实路径。
      # 断言里除了「目标框有内容」，还要求诱饵框为空——
      # 只断言前者的话，专属选择器失效时通用兜底会填到诱饵框，测试照样通过。
      - name: 填入测试
        run: node tests/fill.test.mjs
